apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
  labels:
    app.kubernetes.io/version: "1.0"
spec:
  description: >-
    This task cleans up temporary workspace files and previous build artifacts.
  workspaces:
    - name: source
  steps:
    - name: remove-temp-files
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Cleaning up temporary build artifacts and workspace directories..."
        rm -rf node_modules coverage .nyc_output dist build
        echo "Workspace cleanup completed successfully."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-test
  labels:
    app.kubernetes.io/version: "1.0"
spec:
  description: >-
    This task executes Jest unit tests for Node.js / JavaScript applications.
  workspaces:
    - name: source
  steps:
    - name: test
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Installing dependencies..."
        npm install
        echo "Running Jest Unit Tests..."
        npm test
