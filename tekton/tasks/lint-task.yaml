apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-lint
  labels:
    app.kubernetes.io/version: "1.0"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: cli
spec:
  description: >-
    This task executes ESLint linting for Node.js / JavaScript applications.
  workspaces:
    - name: source
      description: The workspace containing application source code.
  steps:
    - name: lint
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Installing dependencies..."
        npm install
        echo "Running ESLint..."
        npm run lint
