apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: openshift-deploy
  labels:
    app.kubernetes.io/version: "1.0"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: deploy
spec:
  description: >-
    This task deploys application manifests to an OpenShift / Kubernetes cluster using oc/kubectl CLI.
  params:
    - name: MANIFEST_DIR
      type: string
      default: "deploy"
      description: Directory containing deployment YAML files.
    - name: DEPLOYMENT_NAME
      type: string
      default: "cicd-js-app"
      description: Name of the deployment resource to verify.
  workspaces:
    - name: source
      description: Workspace containing deployment manifests.
  steps:
    - name: deploy-to-openshift
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Applying OpenShift deployment manifests from $(params.MANIFEST_DIR)..."
        oc apply -f $(params.MANIFEST_DIR)/
        echo "Checking rollout status for deployment/$(params.DEPLOYMENT_NAME)..."
        oc rollout status deployment/$(params.DEPLOYMENT_NAME) --timeout=300s
